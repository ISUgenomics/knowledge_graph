name: knowledgegraph
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - curl
  - sqlite
  - ripgrep
  - git
  - jq
  - numpy
  - scipy
  - scikit-learn
  - numba
  - llvmlite
  - umap-learn
  - typing_extensions
  - pymupdf
  - python-docx
  - openpyxl
  - pip:
      - -e ./APP
      - fastapi>=0.111.0
      - uvicorn[standard]>=0.29.0
      - httpx>=0.27.0
      - pydantic>=2.7.0
      - pyyaml>=6.0.1
      - watchfiles>=0.21.0
      - pytest>=8.0.0
      - pytest-asyncio>=0.23.0
