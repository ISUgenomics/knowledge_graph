entity_model:
  primary_record_entity: transcript
  entities:
    organism:
      entity_type: organism
      entity_id: organism:bison-bison-query
      name: Bison bison
      metadata:
        scientific_name: Bison bison
        source_alias: Bison
        role: query_assembly
        assembly_namespace: bisbis
    dataset:
      entity_type: dataset
      entity_id: dataset:genomics_bison
      name: Bison functional genomics sample
    chromosome:
      entity_type: chromosome
      source_column: Location
      id_template: chromosome:bison-bison-query:{chromosome}
      name_template: '{chromosome}'
    gene:
      entity_type: gene
      id_column: Gene
      name_column: Gene
      metadata_columns: []
    transcript:
      entity_type: transcript
      id_column: Mrna
      name_column: Mrna
      metadata_columns:
      - Module
      - Annotations
      - Location
      - KidneyToLiverSignificant_LogFoldChange
      - KidneyToLungSignificant_LogFoldChange
      - KidneyToMuscleSignificant_LogFoldChange
      - KidneyToNodeSignificant_LogFoldChange
      - KidneyToSpleenSignificant_LogFoldChange
      - LiverToMuscleSignificant_LogFoldChange
      - LiverToNodeSignificant_LogFoldChange
      - LiverToSpleenSignificant_LogFoldChange
      - LungToMuscleSignificant_LogFoldChange
      - LungToNodeSignificant_LogFoldChange
      - LungToSpleenSignificant_LogFoldChange
      - MuscleToNodeSignificant_LogFoldChange
      - MuscleToSpleenSignificant_LogFoldChange
      - NodeToSpleenSignificant_LogFoldChange
      - AdultFemaleKidneySRR1659047
      - AdultFemaleKidneySRR1659048
      - AdultFemaleKidneySRR1659049
      - AdultFemaleKidneySRR1659050
      - AdultFemaleLiverSRR1659051
      - AdultFemaleLiverSRR1659052
      - AdultFemaleLiverSRR1659053
      - AdultFemaleLiverSRR1659054
      - AdultFemaleLungSRR1659055
      - AdultFemaleLungSRR1659056
      - AdultFemaleLungSRR1659057
      - AdultFemaleLungSRR1659058
      - AdultFemaleSkeletalMuscleSRR1659059
      - AdultFemaleSkeletalMuscleSRR1659060
      - AdultFemaleSkeletalMuscleSRR1659061
      - AdultFemaleSkeletalMuscleSRR1659062
      - AdultFemaleSupramammaryLymphNodeSRR1659063
      - AdultFemaleSupramammaryLymphNodeSRR1659064
      - AdultFemaleSupramammaryLymphNodeSRR1659065
      - AdultFemaleSupramammaryLymphNodeSRR1659066
      - AdultFemaleSpleenSRR1659067
      - AdultFemaleSpleenSRR1659068
      - AdultFemaleSpleenSRR1659069
      - AdultFemaleSpleenSRR1659070
      - MRNA
    protein:
      entity_type: protein
      id_template: '{Mrna}:protein'
      name_template: '{Gene} protein'
      naming:
        priority_labels:
        - column: glycines_effectors_dna
          label: SCN known (N)
        - column: glycines_effectors_prot
          label: SCN known (P)
        fallback_column: Mrna
        fallback_prefix: Unknown
      metadata_columns:
      - Orthogroup
      - Uniprot terms
      - Kegg Terms
      - GO terms
      - Immune System?
      sequence_column: Protein
  relationships:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
promoted_entities:
  shared:
    orthogroup:
      source_column: Orthogroup
      entity_type: orthogroup
      id_template: orthogroup:{value}
      name_template: '{value}'
      attach_from: gene
      relationship_type: BELONGS_TO_ORTHOGROUP
      metadata_columns: []
      metadata_bindings:
      - field: ortholog_count_bos_taurus
        source_column: Cattle
        cast: int
      - field: ortholog_count_bison_local
        source_column: Bison
        cast: int
      - field: ortholog_count_cervus_canadensis
        source_column: Elk
        cast: int
      - field: ortholog_count_bison_refseq
        source_column: NCBI_Bison
        cast: int
      - field: ortholog_member_ids_bos_taurus
        source_column: Cattle.1
        parser: csv_term_list
        zero_as_empty: true
      - field: ortholog_member_ids_bison_local
        source_column: Bison.1
        parser: csv_term_list
        zero_as_empty: true
      - field: ortholog_member_ids_cervus_canadensis
        source_column: Elk.1
        parser: csv_term_list
        zero_as_empty: true
      - field: ortholog_member_ids_bison_refseq
        source_column: NCBI_Bison.1
        parser: csv_term_list
        zero_as_empty: true
      - field: orthologous_uniprot_summary
        source_column: Orthologous Uniprot Annotations
      - field: orthologous_nr_summary
        source_column: Orthologous NR Annotations
  dataset_specific: {}
comparative_entities:
  shared: {}
  dataset_specific:
    bos_taurus_member:
      source_column: Cattle.1
      entity_type: comparative_hit
      id_template: comparative_hit:bos_taurus:{value}
      name_template: '{value}'
      attach_from: orthogroup
      relationship_type: HAS_ORTHOLOG_MEMBER
      target_organism: Bos taurus
      parser: csv_term_list
      metadata:
        external_record_type: protein
        identifier_namespace: bos_taurus_assembly_protein_model
      excluded_values:
      - '0'
    cervus_canadensis_member:
      source_column: Elk.1
      entity_type: comparative_hit
      id_template: comparative_hit:cervus_canadensis:{value}
      name_template: '{value}'
      attach_from: orthogroup
      relationship_type: HAS_ORTHOLOG_MEMBER
      target_organism: Cervus canadensis
      parser: csv_term_list
      metadata:
        external_record_type: transcript
        identifier_namespace: cervus_canadensis_assembly_transcript_model
      excluded_values:
      - '0'
    bison_refseq_member:
      source_column: NCBI_Bison.1
      entity_type: comparative_hit
      id_template: comparative_hit:bison_refseq:{value}
      name_template: '{value}'
      attach_from: orthogroup
      relationship_type: HAS_REFERENCE_MEMBER
      target_organism: Bison bison
      target_organism_entity:
        entity_id: organism:bison-bison-ncbi-reference
        name: NCBI_Bison reference
        metadata:
          scientific_name: Bison bison
          source_alias: NCBI_Bison
          role: reference_annotation
          provider: NCBI RefSeq
      parser: csv_term_list
      metadata:
        external_record_type: protein
        identifier_namespace: refseq_protein
      excluded_values:
      - '0'
annotation_bins:
  shared: []
  dataset_specific:
  - column: GO terms
    namespace: go
    parser: go_plain
    attach_to: protein
    parent_tag: go-annotation
    category: functional_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: Kegg Terms
    namespace: kegg
    parser: term_list
    attach_to: protein
    parent_tag: kegg-pathway
    category: functional_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: Uniprot terms
    namespace: uniprot
    parser: term_list
    attach_to: protein
    parent_tag: uniprot-entry
    category: functional_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
