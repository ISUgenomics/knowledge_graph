contract:
  name: functional_genomics
  version: 1
  path: /workspace/KnowledgeGraph/skills/genomics/contracts/functional_genomics.yaml
  module: genomics
  core_entities:
  - organism
  - dataset
  - chromosome
  - gene
  - transcript
  - protein
  optional_entities:
  - orthogroup
  - bcn_gene
  - comparative_hit
  - hgt_donor
  - annotation_term
  - localization_call
  - prediction_call
  - expression_measure
  - contrast_definition
  required_relationships:
  - &id001
    source: dataset
    type: ABOUT_ORGANISM
    target: organism
  - &id002
    source: gene
    type: FROM_ORGANISM
    target: organism
  - &id003
    source: organism
    type: HAS_CHROMOSOME
    target: chromosome
  - &id004
    source: chromosome
    type: HAS_GENE
    target: gene
  - &id005
    source: gene
    type: HAS_TRANSCRIPT
    target: transcript
  - &id006
    source: transcript
    type: TRANSLATED_TO
    target: protein
  - &id007
    source: gene
    type: IN_DATASET
    target: dataset
