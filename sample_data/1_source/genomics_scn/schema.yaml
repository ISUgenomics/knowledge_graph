      condition<br>- <span class=''text-bright''>Down-regulated</span>: lower expression
      in the <b>second</b> condition<br>- <span class=''text-bright''>Any change</span>:
      either up or down regulation, custom range <br>- <span class=''text-bright''>No
      change</span>: stable expression between conditions.'
    filter.dge_min: "Set the minimum magnitude of differential expression <br><i>log<sub>2</sub>\
      \ fold-change; e.g. 1.0 = 2\xD7 change, 2.0 = 4\xD7</i>."
    filter.dge_max: <i>(optional)</i> <br>Set a maximum magnitude of differential
      expression <br><i>useful to exclude extreme outliers</i>.
    filter.dge_eps: "Define the tolerance for <i>'No change'</i> filtering <br><i>|log<sub>2</sub>\
      \ fold-change| \u2264 \u03B5; e.g., 0.5 (around zero)</i>."
    filter.dge_include_no_data: "Include all N/A results (applies to each DGE rule\
      \ added below). <br>log<sub>2</sub>FC = N/A are skipped by default <br><i>In\
      \ DGE outputs, NA \u2260 0, meaning the selected contrast for this gene was\
      \ not testable / not estimable due to low-count in one or both conditions or\
      \ Cook's distance outlier removal.</i>"
    filter.patterns: Check presence of custom amino acid pattern(s) or known motifs
      in a sequenece.
    filter.input_pattern: Define custom regex pattern(s) to search within the sequence.
      <br>- Use a semicolon (;) to define multiple patterns, <br>each shown as a separate
      row. <br>- Define amino-acid sets with commas <i>(e.g. C,S,H)</i> <br>to highlight
      all occurrences. <br>- Detect sequence motifs using . as a wildcard for any
      amino acid <i>(e.g. GG.G)</i>. <br>- Use '|' to specify alternative motifs on
      the same row <br><i>(e.g. PAPS|PAPSQ)</i>.
    filter.signal_window: Set the sliding-window size used to compute signal profiles.
    filter.window_size: Choose the window length (in amino acids, aa) for profiles.
      <br>- Used for Entropy, NCPR, FCR, and the custom profile track. <br>- Larger
      windows produce smoother profiles. <br>- Smaller windows capture more local
      variation.
    filter.custom_profile: Define a custom amino-acid set for a windowed composition
      profile.
    filter.custom_signal: Enter one or more amino acids to calculate their sliding-window
      fraction across the sequence. <br>- Profile shows the fraction of residues from
      this set in each frame. <br>- Useful for tracking local enrichment of residue
      classes, such as aromatic residues <i>(e.g. FWY)</i>. <br>- The number of aa
      must not exceed the selected window size.
