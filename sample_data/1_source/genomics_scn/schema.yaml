promoted_entities:
  shared:
    orthogroup:
      source_column: orthogroup
      entity_type: orthogroup
      id_template: orthogroup:{value}
      name_template: '{value}'
      attach_from: gene
      relationship_type: BELONGS_TO_ORTHOGROUP
      metadata_columns:
      - schachtii_genes
  dataset_specific: {}
comparative_entities:
  shared: {}
  dataset_specific:
    homolog_family_member:
      source_column: schachtii_genes
      entity_type: bcn_gene
      id_template: bcn_gene:heterodera-schachtii:{value}
      name_template: '{value}'
      attach_from: orthogroup
      relationship_type: HAS_BCN_MEMBER
      target_organism: Heterodera schachtii
      scope_tag_id: homology-scope-cyst-nematode
      parser: term_list
    bcn_hit:
      source_column: schachtii_hits
      entity_type: comparative_hit
      id_template: comparative_hit:cyst_nematode:{value}
      name_template: '{value}'
      attach_from: protein
      relationship_type: HAS_BCN_HIT
      target_organism: Heterodera schachtii
      reuse_target_organism_identity: true
      scope_tag_id: homology-scope-cyst-nematode
      value_parser: comparative_hit_label
      parser: term_list
    nematode_hit:
      source_column: celegans_hits
      entity_type: comparative_hit
      id_template: comparative_hit:nematode:{value}
      name_template: '{value}'
      attach_from: protein
      relationship_type: HAS_NEMATODE_HIT
      scope_tag_id: homology-scope-nematode
      value_parser: comparative_hit_label
      parsed_field_promotions:
      - field: matched_organism
        kind: tag
        parent_tag: homology-hit-organism
        id_template: homology-hit-organism:{value_slug}
        name_template: '{value}'
        rel_type: TAGGED
      parser: term_list
    sp_best_hit:
      source_column: sp_best_hit
      entity_type: comparative_hit
      id_template: comparative_hit:broad_parasitism:{value}
      name_template: '{value}'
      attach_from: protein
      relationship_type: HAS_BROAD_HOMOLOGY_HIT
      scope_tag_id: homology-scope-broad-parasitism
      value_parser: comparative_hit_label
      parsed_field_promotions:
      - field: matched_organism
        kind: tag
        parent_tag: homology-hit-organism
        id_template: homology-hit-organism:{value_slug}
        name_template: '{value}'
        rel_type: TAGGED
      parser: term_list
    nr_best_hit:
      source_column: nr_best_hit
      entity_type: comparative_hit
      id_template: comparative_hit:broad_parasitism:{value}
      name_template: '{value}'
      attach_from: protein
      relationship_type: HAS_BROAD_HOMOLOGY_HIT
      scope_tag_id: homology-scope-broad-parasitism
      value_parser: comparative_hit_label
      parsed_field_promotions:
      - field: matched_organism
        kind: tag
        parent_tag: homology-hit-organism
        id_template: homology-hit-organism:{value_slug}
        name_template: '{value}'
        rel_type: TAGGED
      parser: term_list
    hgt_donor:
      source_column: hgt_donor_id
      entity_type: hgt_donor
      id_template: hgt_donor:{value}
      name_template: '{value}'
      attach_from: protein
      relationship_type: HAS_HGT_DONOR
      edge_metadata_columns:
      - hgt_alien_index
      excluded_values:
      - 'No'
      parser: term_list
annotation_bins:
  shared:
  - column: go_consensus
    namespace: go
    parser: go_plain
    attach_to: protein
    parent_tag: go-annotation
    category: functional_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: deepgoplus
    namespace: go
    parser: go_scored
    attach_to: protein
    parent_tag: go-annotation
    category: functional_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: interpro
    namespace: interpro
    parser: interpro_ids
    attach_to: protein
    parent_tag: interpro-domain
    category: domain_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: pfam
    namespace: pfam
    parser: pfam_ids
    attach_to: protein
    parent_tag: pfam-family
    category: domain_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: smart
    namespace: smart
    parser: smart_ids
    attach_to: protein
    parent_tag: smart-domain
    category: domain_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: funfam
    namespace: funfam
    parser: funfam_ids
    attach_to: protein
    parent_tag: funfam-family
    category: domain_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  - column: panther
    namespace: panther
    parser: panther_ids
    attach_to: protein
    parent_tag: panther-family
    category: domain_annotation
    promoted_entity_type: annotation_term
    promoted_relation_type: HAS_ANNOTATION
    promoted_id_template: annotation:{namespace}:{id}
  dataset_specific: []
tag_bins:
  shared:
  - column: dl_signals
    parser: term_list
    attach_to: protein
    parent_tag: localization-signal
    category: prediction_feature
    promoted_entity_type: prediction_call
    promoted_relation_type: HAS_PREDICTION
    promoted_id_template: prediction:{category}:{id}
  - column: dl_localizations
    parser: term_list
    attach_to: protein
    parent_tag: subcellular-localization
    category: localization
    promoted_entity_type: localization_call
    promoted_relation_type: HAS_LOCALIZATION
    promoted_id_template: localization:{id}
  - column: localizer
    parser: term_list
    attach_to: protein
    parent_tag: subcellular-localization
    category: localization
    promoted_entity_type: localization_call
    promoted_relation_type: HAS_LOCALIZATION
    promoted_id_template: localization:{id}
  - column: expression_bin_13
    parser: single_term
    attach_to: transcript
    parent_tag: expression-bin
    category: expression_summary
  - column: expression_bin_38
    parser: single_term
    attach_to: transcript
    parent_tag: expression-bin
    category: expression_summary
  - column: t_factor
    parser: single_term
    attach_to: protein
    parent_tag: functional-prediction
    category: prediction_feature
    promoted_entity_type: prediction_call
    promoted_relation_type: HAS_PREDICTION
    promoted_id_template: prediction:{category}:{id}
  dataset_specific: []
boolean_tags:
  shared:
  - column: effector_islands
    truthy:
    - 'true'
    - 'yes'
    - '1'
    tag_id: effector-island
    label: Effector Island
    attach_to: gene
    parent_tag: effector-evidence
  dataset_specific: []
value_presence_tags:
  shared:
  - column: schachtii_effectors_known
    tag_id: bcn-known-effector-hit
    label: BCN Known Effector Hit
    attach_to: protein
    parent_tag: effector-evidence
  - column: schachtii_effectors_putative
    tag_id: bcn-putative-effector-hit
