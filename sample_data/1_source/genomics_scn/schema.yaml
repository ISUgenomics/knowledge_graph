      entity_type: dataset
      entity_id: dataset:genomics_scn
      name: Heterodera glycines functional genomics sample
    chromosome:
      entity_type: chromosome
      source_column: genome_location
      id_template: chromosome:heterodera-glycines:{chromosome}
      name_template: '{chromosome}'
    gene:
      entity_type: gene
      id_column: gene_name
      name_column: gene_name
      metadata_columns:
      - genome_location
      - nested_genes
      - nest_genes
      - average_copy_number
